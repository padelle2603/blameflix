name: Build APK and AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion=$APP_VERSION

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/android/*.apk
          if-no-files-found: error

  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Compute version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Sync Electron version
        working-directory: electron
        run: npm run set-version

      - name: Build AppImage
        working-directory: electron
        run: |
          for i in 1 2 3 4 5; do
            if npm run dist; then
              exit 0
            fi
            echo "Attempt $i failed (transient download), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/linux/*.AppImage
          if-no-files-found: error

  windows:
    name: Build Windows exe
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Compute version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Sync Electron version
        working-directory: electron
        run: npm run set-version

      - name: Build portable exe
        working-directory: electron
        run: |
          for i in 1 2 3 4 5; do
            if npm run dist:win; then
              exit 0
            fi
            echo "Attempt $i failed (transient download), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: dist/win/*.exe
          if-no-files-found: error

  release:
    name: Release
    needs: [android, appimage, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: release

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage
          path: release

      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          name: win-exe
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # When the release already exists (e.g. a platform added after the
          # fact), refresh its assets in place instead of recreating it, so
          # the tag, publication date and notes are preserved.
          if gh release view "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "v$APP_VERSION" release/* --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          if [ -f CHANGELOG.md ] && awk -v v="## v$APP_VERSION" '$0 == v { f = 1 } f' CHANGELOG.md | grep -q .; then
            # Extract only the English subsection of the matching changelog entry.
            awk -v v="## v$APP_VERSION" '
              $0 == v { flag = 1; next }
              flag && /^## / { exit }
              flag && /^### English/ { en = 1; next }
              flag && en && /^### / { exit }
              flag && en { print }
            ' CHANGELOG.md > release-notes.md
            printf '\nAndroid APK, Linux AppImage and Windows portable exe.\n' >> release-notes.md
            gh release create "v$APP_VERSION" release/* \
              --title "v$APP_VERSION" \
              --notes-file release-notes.md
          else
            gh release create "v$APP_VERSION" release/* \
              --title "v$APP_VERSION" \
              --notes "Automatic release of BlameFlix v$APP_VERSION. Android APK (com.padelle.blameflix), Linux AppImage and Windows portable exe."
          fi
