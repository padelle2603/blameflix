name: Build APK and AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Inject version into web app
        run: sed -i "s/APP_VERSION = '[^']*'/APP_VERSION = '$APP_VERSION'/" www/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Capacitor sync
        run: npx cap sync android

      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersion=$APP_VERSION

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/android/*.apk
          if-no-files-found: error

  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Compute version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Inject version into web app
        run: sed -i "s/APP_VERSION = '[^']*'/APP_VERSION = '$APP_VERSION'/" www/index.html

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Sync Electron version
        working-directory: electron
        run: |
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$APP_VERSION';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"

      - name: Build AppImage
        working-directory: electron
        run: |
          for i in 1 2 3 4 5; do
            if npm run dist; then
              exit 0
            fi
            echo "Attempt $i failed (transient download), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/linux/*.AppImage
          if-no-files-found: error

  release:
    name: Release
    needs: [android, appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: release

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v$APP_VERSION" --yes 2>/dev/null || true
          gh release create "v$APP_VERSION" release/* \
            --title "BlameFlix v$APP_VERSION" \
            --notes "Automatic release of BlameFlix $APP_VERSION. Android APK (com.padelle.blameflix) and Linux AppImage."
